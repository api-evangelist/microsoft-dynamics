    type: subscription
    description: SMB sales force automation. Lead/opp/account management, basic forecasting.
    entries:
      - label: Per user per month
        name: sales_pro
        type: subscription
        metric: user-month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '$65 per user per month'
        userMultiplied: true
