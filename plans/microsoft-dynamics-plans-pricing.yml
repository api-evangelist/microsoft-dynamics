specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Dynamics
providerId: microsoft-dynamics
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - CRM
  - ERP
  - Microsoft Dynamics
description: Microsoft Dynamics is the legacy umbrella brand that today is delivered as
  Dynamics 365 — a portfolio of cloud business applications licensed per user per month with
  a 'first app full price, attach apps reduced' qualifying-offer model. Sales, Customer
  Service, Field Service, Finance, Supply Chain, Commerce, Project Operations, and Customer
  Insights are sold as separate apps. Business Central serves SMB ERP. Dynamics 365 Contact
  Center and Sales Copilot add agentic / Copilot-priced capabilities. Older on-prem Dynamics
  GP / NAV / SL / AX / CRM are in extended support; new licenses are no longer sold.
sources:
  - https://www.microsoft.com/dynamics-365/pricing
  - https://learn.microsoft.com/en-us/dynamics365/get-started/licensing-overview
  - https://www.microsoft.com/dynamics-365/products/business-central
