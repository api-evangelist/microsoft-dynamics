"""
Microsoft Dynamics 365 Conceptual GraphQL Schema
Source: Dataverse Web API (OData v4), Business Central API v2.0, Finance & Operations OData
Docs: https://docs.microsoft.com/en-us/dynamics365/
"""

# ─── Scalars ────────────────────────────────────────────────────────────────

scalar DateTime
scalar Decimal
scalar GUID
scalar JSON

# ─── Enums ──────────────────────────────────────────────────────────────────

enum AccountStatus {
  ACTIVE
  INACTIVE
}

enum LeadStatus {
  NEW
  CONTACTED
  QUALIFIED
  DISQUALIFIED
}

enum OpportunityStatus {
  OPEN
  WON
  LOST
}

enum IncidentStatus {
  ACTIVE
  RESOLVED
  CANCELLED
}

enum ActivityStatus {
  OPEN
  COMPLETED
  CANCELLED
  SCHEDULED
}

enum CampaignStatus {
  PLANNING
  LAUNCHED
  COMPLETED
  CANCELLED
}

enum ContractStatus {
  DRAFT
  INVOICED
  ACTIVE
  ON_HOLD
  CANCELED
  EXPIRED
}

enum QuoteStatus {
  DRAFT
  ACTIVE
  WON
  CLOSED
}

enum OrderStatus {
  ACTIVE
  SUBMITTED
  CANCELLED
  FULFILLED
  INVOICED
}

enum InvoiceStatus {
  DRAFT
  ACTIVE
  PAID
  CANCELLED
}

enum WorkflowStatus {
  DRAFT
  ACTIVATED
}

# ─── Core CRM Types ─────────────────────────────────────────────────────────

"""A company or organization in Dynamics 365 CRM."""
type Account {
  id: GUID!
  name: String!
  accountNumber: String
  websiteUrl: String
  telephone1: String
  emailAddress: String
  industryCode: String
  revenue: Decimal
  numberOfEmployees: Int
  description: String
  status: AccountStatus!
  primaryContact: Contact
  parentAccount: Account
  businessUnit: BusinessUnit
  territory: Territory
  owner: SystemUser
  contacts: [Contact!]
  opportunities: [Opportunity!]
  incidents: [Incident!]
  campaigns: [Campaign!]
  activities: [Activity!]
  createdOn: DateTime!
  modifiedOn: DateTime!
}

"""An individual person in Dynamics 365 CRM."""
type Contact {
  id: GUID!
  firstName: String!
  lastName: String!
  fullName: String
  emailAddress: String
  telephone1: String
  jobTitle: String
  department: String
  account: Account
  parentContact: Contact
  territory: Territory
  owner: SystemUser
  businessUnit: BusinessUnit
  opportunities: [Opportunity!]
  incidents: [Incident!]
  activities: [Activity!]
  createdOn: DateTime!
  modifiedOn: DateTime!
}

"""A prospective customer or sales lead."""
type Lead {
  id: GUID!
  firstName: String
  lastName: String!
  fullName: String
  companyName: String
  emailAddress: String
  telephone1: String
  jobTitle: String
  leadSourceCode: String
  subject: String
  description: String
  status: LeadStatus!
  qualifiedOn: DateTime
  convertedOpportunity: Opportunity
  convertedAccount: Account
  convertedContact: Contact
  owner: SystemUser
  businessUnit: BusinessUnit
  campaign: Campaign
  createdOn: DateTime!
  modifiedOn: DateTime!
}

"""A potential sale or deal being tracked in the sales pipeline."""
type Opportunity {
  id: GUID!
  name: String!
  description: String
  estimatedRevenue: Decimal
  estimatedCloseDate: DateTime
  actualCloseDate: DateTime
  actualRevenue: Decimal
  probabilityCode: Int
  status: OpportunityStatus!
  account: Account
  contact: Contact
  parentCampaign: Campaign
  owner: SystemUser
  businessUnit: BusinessUnit
  territory: Territory
  products: [OpportunityProduct!]
  competitors: [Competitor!]
  quotes: [Quote!]
  createdOn: DateTime!
  modifiedOn: DateTime!
}

"""A product line item on an Opportunity record."""
type OpportunityProduct {
  id: GUID!
  opportunity: Opportunity!
  product: Product
  productDescription: String
  quantity: Decimal!
  pricePerUnit: Decimal!
  extendedAmount: Decimal!
  discount: Decimal
  tax: Decimal
  uoM: UoM
  createdOn: DateTime!
  modifiedOn: DateTime!
}

"""A competitor tracked within an Opportunity or the system."""
type Competitor {
  id: GUID!
  name: String!
  websiteUrl: String
  opportunities: [Opportunity!]
  createdOn: DateTime!
  modifiedOn: DateTime!
}

