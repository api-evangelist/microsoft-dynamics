  - CRM
  - ERP
  - Microsoft Dynamics
  - Rate Limiting
description: Dynamics 365 customer-engagement apps (Sales, Customer Service, Field Service)
  and the underlying Dataverse share Power Platform service-protection (API request) limits.
  Each user / non-interactive identity is capped at 6,000 API requests per 5-minute sliding
  window per environment. Beyond that, Dataverse returns HTTP 429 with Retry-After. Finance
  / Supply Chain / Business Central each have separate per-environment OData / SOAP API
  limits (~600 calls/min/user typical, raise via support). Long-running operations and bulk
  imports use dedicated Bulk Data Loading APIs that are not subject to interactive throttling.
sources:
  - https://learn.microsoft.com/en-us/power-apps/developer/data-platform/api-limits
  - https://learn.microsoft.com/en-us/power-platform/admin/api-request-limits-allocations
  - https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/administration/operational-limits-online
headers:
  retryAfter: Retry-After
  rateLimitLimit: x-ms-ratelimit-burst-remaining-xrm-requests
  rateLimitTimeRemaining: x-ms-ratelimit-time-remaining-xrm-requests
  msResource: x-ms-ratelimit-rule
responseCodes:
  throttled: 429
  serviceUnavailable: 503
  serviceProtection: 429
limits:
  - name: Dataverse — per-user 5-minute sliding window
    scope: user/environment
    metric: requests_per_5_minutes
    limit: 6000
    timeFrame: minute
    notes: Service-protection limit for any one user / non-interactive identity in any
      single environment.
  - name: Dataverse — per-user execution time
    scope: user/environment
    metric: combined_execution_seconds_per_5_minutes
    limit: 1200
    timeFrame: minute
    notes: 20 minutes of combined API execution time per user per 5-min window.
  - name: Dataverse — concurrent connections per user
    scope: user/environment
    metric: concurrent_connections
    limit: 52
    notes: Concurrent connections to the Web API.
  - name: Power Platform — non-licensed / non-interactive request entitlement
    scope: tenant
    metric: requests_per_24h
    limit: see vendor docs (varies by license tier)
    notes: Daily allocation of Dataverse API requests per licensed user (40k / 6k / etc.)
      pooled at the tenant level.
  - name: Business Central — OData / SOAP per environment
    scope: environment
    metric: requests_per_minute
    limit: 600
    timeFrame: minute
    notes: Default soft limit. 300 concurrent requests cap per environment.
  - name: Finance & Operations — OData per user
    scope: user/environment
    metric: requests_per_minute
    limit: see vendor docs
    notes: Per-user OData throttling; raise via support. Bulk loads should use Data Management
      Framework / Bulk Data Loading APIs.
policies:
  - name: Service Protection API limits
    description: Dataverse and Power Platform throttle on three orthogonal dimensions — number
      of requests, combined execution time, and concurrent connections. Hitting any returns 429.
  - name: Honor Retry-After
    description: Implement exponential backoff with jitter; SDK auto-retries on 429.
  - name: Use bulk APIs for high-volume
    description: For bulk creates/updates use the Bulk Data Loading APIs (Web API
      $batch, ExecuteMultiple, or DMF) to amortize the per-request cost.
  - name: Spread across application users
    description: Use multiple application users (service principals) for high-throughput
      automation; each gets its own 6,000-per-5-min envelope.
  - name: Limit increase via support
    description: Per-environment caps on Business Central and Finance & Operations can be
      raised by support; Dataverse service-protection is fixed.
