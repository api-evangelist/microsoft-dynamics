naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Dataverse Web API — Accounts
  description: 'Microsoft Dynamics 365 Dataverse Web API — Accounts. 5 operations. Lead operation: Microsoft Dynamics List
    accounts. Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: dataverse-accounts
    baseUri: https://{organization}.api.crm.dynamics.com/api/data/v9.2
    description: Microsoft Dynamics 365 Dataverse Web API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: accounts
      path: /accounts
      operations:
      - name: listaccounts
        method: GET
        description: Microsoft Dynamics List accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createaccount
        method: POST
        description: Microsoft Dynamics Create an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: accounts({accountid})
      path: /accounts({accountid})
      operations:
      - name: getaccount
        method: GET
        description: Microsoft Dynamics Get an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountid
          in: path
          type: string
          required: true
      - name: updateaccount
        method: PATCH
        description: Microsoft Dynamics Update an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountid
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteaccount
        method: DELETE
        description: Microsoft Dynamics Delete an account
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountid
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: dataverse-accounts-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Dataverse Web API — Accounts. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/accounts
      name: accounts
      description: REST surface for accounts.
      operations:
      - method: GET
        name: listaccounts
        description: Microsoft Dynamics List accounts
        call: dataverse-accounts.listaccounts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createaccount
        description: Microsoft Dynamics Create an account
        call: dataverse-accounts.createaccount
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accounts-accountid
      name: accounts-accountid
      description: REST surface for accounts({accountid}).
      operations:
      - method: GET
        name: getaccount
        description: Microsoft Dynamics Get an account
        call: dataverse-accounts.getaccount
        with:
          accountid: rest.accountid
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateaccount
        description: Microsoft Dynamics Update an account
        call: dataverse-accounts.updateaccount
        with:
          accountid: rest.accountid
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteaccount
        description: Microsoft Dynamics Delete an account
        call: dataverse-accounts.deleteaccount
        with:
          accountid: rest.accountid
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dataverse-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Dataverse Web API — Accounts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-accounts
      description: Microsoft Dynamics List accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dataverse-accounts.listaccounts
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-create-account
      description: Microsoft Dynamics Create an account
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: dataverse-accounts.createaccount
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-get-account
      description: Microsoft Dynamics Get an account
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dataverse-accounts.getaccount
      with:
        accountid: tools.accountid
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-update-account
      description: Microsoft Dynamics Update an account
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: dataverse-accounts.updateaccount
      with:
        accountid: tools.accountid
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-delete-account
      description: Microsoft Dynamics Delete an account
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: dataverse-accounts.deleteaccount
      with:
        accountid: tools.accountid
      outputParameters:
      - type: object
        mapping: $.
