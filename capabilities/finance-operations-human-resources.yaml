naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Finance & Operations Data API — Human Resources
  description: 'Microsoft Dynamics 365 Finance & Operations Data API — Human Resources. 1 operations. Lead operation: Microsoft
    Dynamics List workers. Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Human Resources
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: finance-operations-human-resources
    baseUri: https://{environment}.operations.dynamics.com/data
    description: Microsoft Dynamics 365 Finance & Operations Data API — Human Resources business capability. Self-contained,
      no shared references.
    resources:
    - name: Workers
      path: /Workers
      operations:
      - name: listworkers
        method: GET
        description: Microsoft Dynamics List workers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: finance-operations-human-resources-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Finance & Operations Data API — Human Resources. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/workers
      name: workers
      description: REST surface for Workers.
      operations:
      - method: GET
        name: listworkers
        description: Microsoft Dynamics List workers
        call: finance-operations-human-resources.listworkers
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: finance-operations-human-resources-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Finance & Operations Data API — Human Resources. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-workers
      description: Microsoft Dynamics List workers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: finance-operations-human-resources.listworkers
      outputParameters:
      - type: object
        mapping: $.
