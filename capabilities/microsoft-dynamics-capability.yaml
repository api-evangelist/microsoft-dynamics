info:
  label: Microsoft Dynamics 365 Business Central API
  description: The Microsoft Dynamics 365 Business Central API (v2.0) provides a RESTful interface for integrating with Business
    Central. It exposes standard business entities such as customers, vendors, items, sales orders, purchase orders, journals,
    and general ledger entries. The API uses OData v4 conventions and requires Microsoft Entra ID (Azure AD) authentication.
  tags:
  - Microsoft
  - Dynamics
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
