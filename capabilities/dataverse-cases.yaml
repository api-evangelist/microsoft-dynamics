naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Dataverse Web API — Cases
  description: 'Microsoft Dynamics 365 Dataverse Web API — Cases. 2 operations. Lead operation: Microsoft Dynamics List cases.
    Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Cases
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: dataverse-cases
    baseUri: https://{organization}.api.crm.dynamics.com/api/data/v9.2
    description: Microsoft Dynamics 365 Dataverse Web API — Cases business capability. Self-contained, no shared references.
    resources:
    - name: incidents
      path: /incidents
      operations:
      - name: listcases
        method: GET
        description: Microsoft Dynamics List cases
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcase
        method: POST
        description: Microsoft Dynamics Create a case
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: dataverse-cases-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Dataverse Web API — Cases. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/incidents
      name: incidents
      description: REST surface for incidents.
      operations:
      - method: GET
        name: listcases
        description: Microsoft Dynamics List cases
        call: dataverse-cases.listcases
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcase
        description: Microsoft Dynamics Create a case
        call: dataverse-cases.createcase
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dataverse-cases-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Dataverse Web API — Cases. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-cases
      description: Microsoft Dynamics List cases
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dataverse-cases.listcases
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-create-case
      description: Microsoft Dynamics Create a case
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: dataverse-cases.createcase
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
