naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Finance & Operations Data API — Vendors
  description: 'Microsoft Dynamics 365 Finance & Operations Data API — Vendors. 2 operations. Lead operation: Microsoft Dynamics
    List vendors. Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Vendors
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: finance-operations-vendors
    baseUri: https://{environment}.operations.dynamics.com/data
    description: Microsoft Dynamics 365 Finance & Operations Data API — Vendors business capability. Self-contained, no shared
      references.
    resources:
    - name: Vendors
      path: /Vendors
      operations:
      - name: listvendors
        method: GET
        description: Microsoft Dynamics List vendors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createvendor
        method: POST
        description: Microsoft Dynamics Create a vendor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: finance-operations-vendors-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Finance & Operations Data API — Vendors. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/vendors
      name: vendors
      description: REST surface for Vendors.
      operations:
      - method: GET
        name: listvendors
        description: Microsoft Dynamics List vendors
        call: finance-operations-vendors.listvendors
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createvendor
        description: Microsoft Dynamics Create a vendor
        call: finance-operations-vendors.createvendor
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: finance-operations-vendors-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Finance & Operations Data API — Vendors. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-vendors
      description: Microsoft Dynamics List vendors
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: finance-operations-vendors.listvendors
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-create-vendor
      description: Microsoft Dynamics Create a vendor
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: finance-operations-vendors.createvendor
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
