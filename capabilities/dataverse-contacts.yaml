naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Dataverse Web API — Contacts
  description: 'Microsoft Dynamics 365 Dataverse Web API — Contacts. 5 operations. Lead operation: Microsoft Dynamics List
    contacts. Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Contacts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: dataverse-contacts
    baseUri: https://{organization}.api.crm.dynamics.com/api/data/v9.2
    description: Microsoft Dynamics 365 Dataverse Web API — Contacts business capability. Self-contained, no shared references.
    resources:
    - name: contacts
      path: /contacts
      operations:
      - name: listcontacts
        method: GET
        description: Microsoft Dynamics List contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createcontact
        method: POST
        description: Microsoft Dynamics Create a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: contacts({contactid})
      path: /contacts({contactid})
      operations:
      - name: getcontact
        method: GET
        description: Microsoft Dynamics Get a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contactid
          in: path
          type: string
          required: true
      - name: updatecontact
        method: PATCH
        description: Microsoft Dynamics Update a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contactid
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletecontact
        method: DELETE
        description: Microsoft Dynamics Delete a contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: contactid
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: dataverse-contacts-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Dataverse Web API — Contacts. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/contacts
      name: contacts
      description: REST surface for contacts.
      operations:
      - method: GET
        name: listcontacts
        description: Microsoft Dynamics List contacts
        call: dataverse-contacts.listcontacts
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createcontact
        description: Microsoft Dynamics Create a contact
        call: dataverse-contacts.createcontact
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts-contactid
      name: contacts-contactid
      description: REST surface for contacts({contactid}).
      operations:
      - method: GET
        name: getcontact
        description: Microsoft Dynamics Get a contact
        call: dataverse-contacts.getcontact
        with:
          contactid: rest.contactid
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updatecontact
        description: Microsoft Dynamics Update a contact
        call: dataverse-contacts.updatecontact
        with:
          contactid: rest.contactid
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletecontact
        description: Microsoft Dynamics Delete a contact
        call: dataverse-contacts.deletecontact
        with:
          contactid: rest.contactid
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dataverse-contacts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Dataverse Web API — Contacts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-contacts
      description: Microsoft Dynamics List contacts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dataverse-contacts.listcontacts
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-create-contact
      description: Microsoft Dynamics Create a contact
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: dataverse-contacts.createcontact
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-get-contact
      description: Microsoft Dynamics Get a contact
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dataverse-contacts.getcontact
      with:
        contactid: tools.contactid
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-update-contact
      description: Microsoft Dynamics Update a contact
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: dataverse-contacts.updatecontact
      with:
        contactid: tools.contactid
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-delete-contact
      description: Microsoft Dynamics Delete a contact
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: dataverse-contacts.deletecontact
      with:
        contactid: tools.contactid
      outputParameters:
      - type: object
        mapping: $.
