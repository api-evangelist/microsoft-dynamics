naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Business Central API — Employees
  description: 'Microsoft Dynamics 365 Business Central API — Employees. 2 operations. Lead operation: Microsoft Dynamics
    List employees. Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Employees
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: business-central-employees
    baseUri: https://api.businesscentral.dynamics.com/v2.0/{tenantId}/{environment}/api/v2.0
    description: Microsoft Dynamics 365 Business Central API — Employees business capability. Self-contained, no shared references.
    resources:
    - name: companies({companyId})-employees
      path: /companies({companyId})/employees
      operations:
      - name: listemployees
        method: GET
        description: Microsoft Dynamics List employees
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createemployee
        method: POST
        description: Microsoft Dynamics Create an employee
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: business-central-employees-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Business Central API — Employees. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/companies-companyid/employees
      name: companies-companyid-employees
      description: REST surface for companies({companyId})-employees.
      operations:
      - method: GET
        name: listemployees
        description: Microsoft Dynamics List employees
        call: business-central-employees.listemployees
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createemployee
        description: Microsoft Dynamics Create an employee
        call: business-central-employees.createemployee
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: business-central-employees-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Business Central API — Employees. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-employees
      description: Microsoft Dynamics List employees
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-central-employees.listemployees
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-create-employee
      description: Microsoft Dynamics Create an employee
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: business-central-employees.createemployee
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
