naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Business Central API — Purchase Invoices
  description: 'Microsoft Dynamics 365 Business Central API — Purchase Invoices. 2 operations. Lead operation: Microsoft Dynamics
    List purchase invoices. Self-contained Naftiko capability covering one Microsoft Dynamics business surface.'
  tags:
  - Microsoft Dynamics
  - Purchase Invoices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: business-central-purchase-invoices
    baseUri: https://api.businesscentral.dynamics.com/v2.0/{tenantId}/{environment}/api/v2.0
    description: Microsoft Dynamics 365 Business Central API — Purchase Invoices business capability. Self-contained, no shared
      references.
    resources:
    - name: companies({companyId})-purchaseInvoices
      path: /companies({companyId})/purchaseInvoices
      operations:
      - name: listpurchaseinvoices
        method: GET
        description: Microsoft Dynamics List purchase invoices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createpurchaseinvoice
        method: POST
        description: Microsoft Dynamics Create a purchase invoice
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: business-central-purchase-invoices-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Business Central API — Purchase Invoices. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/companies-companyid/purchaseinvoices
      name: companies-companyid-purchaseinvoices
      description: REST surface for companies({companyId})-purchaseInvoices.
      operations:
      - method: GET
        name: listpurchaseinvoices
        description: Microsoft Dynamics List purchase invoices
        call: business-central-purchase-invoices.listpurchaseinvoices
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createpurchaseinvoice
        description: Microsoft Dynamics Create a purchase invoice
        call: business-central-purchase-invoices.createpurchaseinvoice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: business-central-purchase-invoices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Business Central API — Purchase Invoices. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-purchase-invoices
      description: Microsoft Dynamics List purchase invoices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: business-central-purchase-invoices.listpurchaseinvoices
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-dynamics-create-purchase-invoice
      description: Microsoft Dynamics Create a purchase invoice
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: business-central-purchase-invoices.createpurchaseinvoice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
