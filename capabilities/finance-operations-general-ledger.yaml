naftiko: 1.0.0-alpha2
info:
  label: Microsoft Dynamics 365 Finance & Operations Data API — General Ledger
  description: 'Microsoft Dynamics 365 Finance & Operations Data API — General Ledger. 1 operations. Lead operation: Microsoft
    Dynamics List general journal account entries. Self-contained Naftiko capability covering one Microsoft Dynamics business
    surface.'
  tags:
  - Microsoft Dynamics
  - General Ledger
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_DYNAMICS_API_KEY: MICROSOFT_DYNAMICS_API_KEY
capability:
  consumes:
  - type: http
    namespace: finance-operations-general-ledger
    baseUri: https://{environment}.operations.dynamics.com/data
    description: Microsoft Dynamics 365 Finance & Operations Data API — General Ledger business capability. Self-contained,
      no shared references.
    resources:
    - name: GeneralJournalAccountEntries
      path: /GeneralJournalAccountEntries
      operations:
      - name: listgeneraljournalaccountentries
        method: GET
        description: Microsoft Dynamics List general journal account entries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_DYNAMICS_API_KEY}}'
  exposes:
  - type: rest
    namespace: finance-operations-general-ledger-rest
    port: 8080
    description: REST adapter for Microsoft Dynamics 365 Finance & Operations Data API — General Ledger. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/generaljournalaccountentries
      name: generaljournalaccountentries
      description: REST surface for GeneralJournalAccountEntries.
      operations:
      - method: GET
        name: listgeneraljournalaccountentries
        description: Microsoft Dynamics List general journal account entries
        call: finance-operations-general-ledger.listgeneraljournalaccountentries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: finance-operations-general-ledger-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Dynamics 365 Finance & Operations Data API — General Ledger. One tool per consumed
      operation, routed inline through this capability's consumes block.
    tools:
    - name: microsoft-dynamics-list-general-journal
      description: Microsoft Dynamics List general journal account entries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: finance-operations-general-ledger.listgeneraljournalaccountentries
      outputParameters:
      - type: object
        mapping: $.
