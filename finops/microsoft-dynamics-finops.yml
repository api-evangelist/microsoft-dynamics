    description: Power Platform request entitlement consumed beyond licensed allocation.
    unit: request
    aggregation: sum
    dimensions:
      - environment
      - service_principal
principles:
  - name: Visibility
    description: Microsoft 365 admin center > Billing surfaces seat allocations and the
      qualifying-offer attach status. Power Platform admin center > Resources > Capacity shows
      Dataverse storage and API entitlement consumption. FOCUS-aligned commerce exports
      itemize each Dynamics SKU.
  - name: Allocation
    description: Tag users by department / cost-center via Entra ID groups; group-rule
      assignment enforces the right SKU per role. Multi-org deployments split seats by
      environment to drive chargeback.
  - name: Optimization
    description: Use qualifying-offer attach for users needing multiple apps (e.g., Sales
      Enterprise primary + Customer Service attach at $20). Replace full Sales/CS users with
      Team Members ($8) where read-only access is enough. Buy Customer Insights at the
      profile band actually used; right-size profile capacity quarterly. Prefer Business
      Central over full Finance/SCM for SMB deployments. Disable trial environments that
      auto-create when developers explore; they consume capacity.
  - name: Accountability
    description: License administrator approves new seat purchases; FinOps validates
      attach-eligibility before each purchase. Quarterly audit of last-sign-in date triggers
      seat reclamation. Set Cost Management budget on the M365/Dynamics commerce subscription
      with alerts at 80/100%.
