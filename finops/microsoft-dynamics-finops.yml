description: FOCUS-aligned FinOps for Microsoft Dynamics — primarily per-user-per-month seat
  pricing across Sales, Customer Service, Finance, Supply Chain, Field Service, Business
  Central, and tenant-priced platforms (Customer Insights). Significant savings from the
  qualifying-offer attach pricing — first app full price, subsequent apps for the same user
  at the attach rate ($20 / $30 / etc.). Largest waste signals are paying full price on
  attach-eligible users and over-provisioning Customer Insights profile capacity.
