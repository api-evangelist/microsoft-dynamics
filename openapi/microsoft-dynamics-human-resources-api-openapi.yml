openapi: 3.2.0
info:
  title: Microsoft Dynamics 365 Finance & Operations Data Human Resources API
  description: The Microsoft Dynamics 365 Finance & Operations Data API exposes business data entities via OData v4 RESTful endpoints. It provides access to finance, supply chain, manufacturing, and human resources data including customers, vendors, products, sales orders, purchase orders, and general ledger journals. Authentication is handled via Microsoft Entra ID (Azure AD).
  version: '1.0'
  contact:
    name: Microsoft
    url: https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/data-entities/odata
  license:
    name: Microsoft APIs Terms of Use
    url: https://learn.microsoft.com/en-us/legal/microsoft-apis/terms-of-use
servers:
- url: https://{environment}.operations.dynamics.com/data
  description: Dynamics 365 Finance & Operations Online
  variables:
    environment:
      default: myorg
      description: The environment-specific subdomain.
security:
- oauth2: []
tags:
- name: Human Resources
paths:
  /Workers:
    get:
      summary: Microsoft Dynamics List workers
      description: Retrieves the collection of worker (employee) data entities.
      operationId: listWorkers
      tags:
      - Human Resources
      parameters:
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/orderby'
      - $ref: '#/components/parameters/crossCompany'
      responses:
        '200':
          description: A collection of worker entities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkerEntity'
components:
  schemas:
    WorkerEntity:
      type: object
      properties:
        PersonnelNumber:
          type: string
        FirstName:
          type: string
        MiddleName:
          type: string
        LastName:
          type: string
        NameAlias:
          type: string
        KnownAs:
          type: string
        PrimaryContactEmail:
          type: string
        PrimaryContactPhone:
          type: string
        EmploymentStartDate:
          type: string
          format: date
        EmploymentEndDate:
          type: string
          format: date
        WorkerType:
          type: string
          enum:
          - Employee
          - Contractor
        dataAreaId:
          type: string
  parameters:
    filter:
      name: $filter
      in: query
      description: OData filter expression.
      schema:
        type: string
    top:
      name: $top
      in: query
      description: Maximum number of records to return (max 10000).
      schema:
        type: integer
    orderby:
      name: $orderby
      in: query
      description: Comma-separated list of properties to sort by.
      schema:
        type: string
    skip:
      name: $skip
      in: query
      description: Number of records to skip.
      schema:
        type: integer
    crossCompany:
      name: cross-company
      in: query
      description: Set to true to retrieve data across all legal entities.
      schema:
        type: boolean
    select:
      name: $select
      in: query
      description: Comma-separated list of properties to include.
      schema:
        type: string
  securitySchemes:
    oauth2:
      type: oauth2
      description: Microsoft Entra ID (Azure AD) OAuth 2.0 authentication.
      flows:
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes:
            https://myorg.operations.dynamics.com/.default: Access Finance & Operations API
